<!DOCTYPE html>
<html><head><title>Demo User(@demo.user) Instagram profile</title></head>
<body>
<div class="profile">
  <div class="name">
    <h1 class="fullname">Demo User</h1>
    <div class="username"><h2>@demo.user</h2></div>
  </div>
  <div class="info">
    <div class="count">
      <div class="item item_posts">
        <div class="txt">Posts</div>
        <div class="num" title="42">42</div>
      </div>
      <div class="item item_followers">
        <div class="txt">Followers</div>
        <div class="num" title="10">10</div>
      </div>
    </div>
  </div>
</div>
<input type="hidden" name="username" value="demo.user">
<input type="hidden" name="userid" value="4242">

<div class="posts">
  <div class="post_box be-1">
    <div class="cover">
      <a href="/post/AaBbCc11111/" class="cover_link" target="_blank">
        <img alt="first photo" class="lazyload img" data-src="https://sp1.pixnoy.com/p/pt_a.jpg">
      </a>
    </div>
    <div class="down">
      <a class="downbtn" href="https://scontent.cdninstagram.com/v/t51.82787-15/one.jpg?stp=dst-jpg_e35&amp;dl=1">Download</a>
    </div>
    <div class="meta">
      <div class="sum">first photo</div>
      <div class="time"><span class="txt">1 day ago</span></div>
    </div>
  </div>
  <div class="post_box be-1">
    <div class="cover">
      <a href="/post/VvWwXx22222/" class="cover_link">
        <img alt="a reel" class="img" data-src="https://sp1.pixnoy.com/p/pt_b.jpg">
      </a>
    </div>
    <div class="down">
      <a class="downbtn" href="https://scontent.cdninstagram.com/v/t66.30100-16/clip.mp4?dl=1">Download</a>
    </div>
    <div class="meta">
      <div class="time"><span class="txt">3 days ago</span></div>
    </div>
    <div class="corner"><span class="icon icon_video"></span></div>
  </div>
  <div class="post_box be-1">
    <div class="cover">
      <a href="/post/{{=value.shortcode}}/" class="cover_link">
        <img class="img" src="{{=value.pic_p}}">
      </a>
    </div>
  </div>
  <div class="btn"><a href="javascript:void(0);" class="more_btn" data-next="NEXT_TOKEN_2" data-maxid="99_4242">View more</a></div>
</div>
</body></html>
